name: エンドカード作成（SNSごと）

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "作るSNS（空欄なら全部：instagram youtube x tiktok）"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-4koma
  cancel-in-progress: false

jobs:
  end-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sns/scripts/requirements.txt

      - run: pip install -r sns/scripts/requirements.txt

      - name: エンドカードを生成
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python sns/scripts/make_end_cards.py ${{ github.event.inputs.platforms }}

      - name: 保存（コミット）
        id: commit
        run: |
          git config user.name "sns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sns/assets/reel
          git commit -m "エンドカードを作成"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 確認用のIssueを作成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/sns/assets/reel"
          body="## 新しいエンドカード

          | Instagram | YouTube | X | TikTok |
          |---|---|---|---|
          | <img src=\"${raw}/end_card_instagram.jpg\" width=\"200\"> | <img src=\"${raw}/end_card_youtube.jpg\" width=\"200\"> | <img src=\"${raw}/end_card_x.jpg\" width=\"200\"> | <img src=\"${raw}/end_card_tiktok.jpg\" width=\"200\"> |

          気に入らないものがあれば、Actions の「エンドカード作成」をもう一度実行してください（SNS名を入れるとそれだけ作り直せます）。"
          gh issue create --title "【確認】SNSごとのエンドカード" --body "$body"
