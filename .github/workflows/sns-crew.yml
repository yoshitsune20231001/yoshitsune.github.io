name: 超人チーム作成（ダッシュボード用）

on:
  workflow_dispatch:
    inputs:
      roles:
        description: "作る担当（空欄なら全員：commander instagram youtube x tiktok note）"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-4koma
  cancel-in-progress: false

jobs:
  crew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sns/scripts/requirements.txt

      - run: pip install -r sns/scripts/requirements.txt

      - name: 超人チームの絵を生成
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python sns/scripts/make_crew.py ${{ github.event.inputs.roles }}

      - name: 保存（コミット）
        id: commit
        run: |
          git config user.name "sns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sns/assets/crew
          git commit -m "超人チームの絵を作成"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 確認用のIssueを作成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/sns/assets/crew"
          cell() { echo "<img src=\"${raw}/$1.jpg\" width=\"180\">"; }
          body="## 超人チーム（ダッシュボード用）

          | 司令塔 | インスタ | YouTube |
          |---|---|---|
          | $(cell commander) | $(cell instagram) | $(cell youtube) |

          | X | TikTok | note |
          |---|---|---|
          | $(cell x) | $(cell tiktok) | $(cell note) |

          元ネタに似すぎているところがないか確認してください。作り直したい担当は、Actions の「超人チーム作成」を担当名（例：x）を入れて実行します。"
          gh issue create --title "【確認】超人チーム" --body "$body"
