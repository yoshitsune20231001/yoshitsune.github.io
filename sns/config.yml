# ---- 投稿時刻（日本時間）----
# 生成は毎朝7時。確認・承認したものを、この時刻に投稿します（自動投稿は今後追加）
# 2〜4週間後に各アプリの分析（インサイト）で反応の良い時間を見て調整してください
schedule:
  - {sns: YouTubeショート,      day: 当日, time: "18:00"}
  - {sns: TikTok,               day: 当日, time: "19:00"}
  - {sns: インスタ（リール）,    day: 当日, time: "20:00"}
  - {sns: Facebook,             day: 当日, time: "20:00"}
  - {sns: ストーリーズ,          day: 当日, time: "20:05"}
  - {sns: X,                    day: 当日, time: "21:00"}
  - {sns: note,                 day: 当日, time: "23:00"}
  - {sns: インスタ（カルーセル）, day: 当日, time: "12:00"}

# ---- リール動画（第10話と同じ構成）----
reel:
  fps: 30
  title_seconds: 2.75     # タイトルカード
  hook_seconds: 2.5       # フックの一文
  panel_seconds: 3.5      # 1コマあたり
  panel_zoom: 0.05        # 1コマ表示中にゆっくり寄る量（0で静止）
  closing_seconds: 2.5    # 締め（ロゴ・販売中）
  end_seconds: 3.25       # エンドカード（いいね＆フォロー）
  # SNSごとのエンドカード（無い場合は end_card.jpg を使う）
  platforms:
    instagram: sns/assets/reel/end_card_instagram.jpg
    youtube: sns/assets/reel/end_card_youtube.jpg
    x: sns/assets/reel/end_card_x.jpg
    tiktok: sns/assets/reel/end_card_tiktok.jpg
  shop_line: オンラインショップで販売中
  shop_sub: プロフィールのリンクから
  # sns/assets/bgm/ の mp3 からランダムで1曲、下の SNS の動画にだけBGMを付けます（ほかは無音）
  # 今は自作のポップスBGM10曲（make_bgm.py で作成）。商用OK・再配布OKの mp3 を足してもOK
  bgm_for: [instagram]      # インスタのリール・ストーリーズ（Facebookも同じ動画）
  bgm_volume: 0.6

