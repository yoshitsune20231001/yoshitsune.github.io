<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok 連携</title>
<style>
  :root { --bg:#faf7f2; --fg:#2b2620; --card:#fff; --line:#e6ddd0; --accent:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1a17; --fg:#f1ece4; --card:#2a2622; --line:#443d35; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif; line-height:1.7; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  code { display:block; word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; font-size:15px; }
  button { margin-top:12px; font-size:16px; padding:10px 18px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  .err { color:var(--accent); font-weight:bold; }
</style>
</head>
<body>
<main>
  <h1>🦝🐱 TikTok とつなぐ</h1>
  <div class="card" id="box">読み込み中…</div>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const box = document.getElementById("box");
  const code = p.get("code");
  if (code) {
    box.innerHTML = `<p><b>① このコードをコピーしてください</b>（10分以内に使ってください）</p>
      <code id="c"></code><button id="b">コピー</button>
      <p><b>② GitHub の「X・YouTube・TikTok 自動投稿」→「Run workflow」で</b><br>
      mode を <b>tiktok_code</b> にして、code にこのコードを貼り付けて実行します。</p>`;
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = async () => {
      try { await navigator.clipboard.writeText(code); document.getElementById("b").textContent = "コピーしました ✓"; } catch (e) {}
    };
  } else if (p.get("error")) {
    box.innerHTML = `<p class="err">つなげませんでした</p><p></p>`;
    box.querySelector("p:last-child").textContent = p.get("error_description") || p.get("error");
  } else {
    box.textContent = "このページは、TikTok とつないだあとに表示される画面です。";
  }
</script>
</body>
</html>
